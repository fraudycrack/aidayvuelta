<script>
    const hashCorrecto = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verificarPassword() {
        let pass = document.getElementById('passwordInput').value;
        let hashIngresado = await sha256(pass);

        if (hashIngresado === hashCorrecto) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            if (catalogo.length > 0) {
                document.getElementById('videoPlayer').src = catalogo[0].url;
            }
            cargar(catalogo);
        } else {
            let error = document.getElementById('errorMsg');
            error.style.display = 'block';
            document.getElementById('passwordInput').value = '';
        }
    }

    // Función para alternar el zoom del vídeo directamente desde la web

        let v = document.getElementById('videoPlayer');

            v.style.objectFit = 'contain';
            btn.innerText = 'Modo: Ajustado';

    function cargar(lista) {
        document.getElementById('filmes').innerHTML = "";
        document.getElementById('series').innerHTML = "";
        lista.forEach(item => {
            let btn = document.createElement('button');btn.className = 'item-btn';
            btn.innerText = item.title;
            btn.title = item.title;
            btn.onclick = () => { 
                let v = document.getElementById('videoPlayer');
                v.src = item.url; 
                v.play(); 
            };
            document.getElementById(item.type === 'filme' ? 'filmes' : 'series').appendChild(btn);
        });
    }

    function filtrar() {
        let texto = document.getElementById('searchInput').value.toLowerCase().trim();
        let queryWords = texto.split(/\s+/);
        
        let filtrado = catalogo.filter(item => {
            let titleLower = item.title.toLowerCase();
            return queryWords.every(word => titleLower.includes(word));
        });
        
        cargar(filtrado);
    }
