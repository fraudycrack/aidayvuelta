    function cargar(lista) {
        document.getElementById('filmes').innerHTML = "";
        document.getElementById('series').innerHTML = "";
        lista.forEach(item => {
            let btn = document.createElement('button');
            btn.innerText = item.title;
            btn.title = item.title;
            btn.onclick = () => { 
                let v = document.getElementById('videoPlayer');
                v.src = item.url; 
                v.play(); 
            };
            document.getElementById(item.type === 'filme' ? 'filmes' : 'series').appendChild(btn);
        });
    }function filtrar() {
        let texto = document.getElementById('searchInput').value.toLowerCase();
        let filtrado = catalogo.filter(i => i.title.toLowerCase().includes(texto));
        cargar(filtrado);
    }

    if (catalogo.length > 0) {
        document.getElementById('videoPlayer').src = catalogo[0].url;
    }
    cargar(catalogo);
