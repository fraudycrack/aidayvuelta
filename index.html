<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aida y Vuelta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .player-container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 950px;
            width: 92%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-container h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 1px;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 550px;
            border-radius: 10px;
            outline: none;
            background: #000;
        }
        .playlist {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .playlist button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            text-align: center;
        }
        .playlist button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>Aida y Vuelta</h1>
        <video id="videoPlayer" controls autoplay>
            Tu navegador no soporta el elemento de video.
        </video>
        <div class="playlist" id="playlist">
            <!-- Los botones se generan automáticamente -->
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const playlistContainer = document.getElementById('playlist');

        const videoFiles = [
            {
                name: "Aida y Vuelta",
                url: "https://media.githubusercontent.com/media/fraudycrack/aidayvuelta/refs/heads/main/Aida_y_Vuelta.mp4"
            },
            {
                name: "Capítulo Regalo",
                url: "https://media.githubusercontent.com/media/fraudycrack/aidayvuelta/refs/heads/main/Capitulo_Regalo.mp4"
            }
        ];

        if (videoFiles.length > 0) {
            videoPlayer.src = videoFiles[0].url;
        }

        videoFiles.forEach((video) => {
            const button = document.createElement('button');
            button.innerText = video.name;
            button.onclick = () => {
                videoPlayer.src = video.url;
                videoPlayer.play();
            };
            playlistContainer.appendChild(button);
        });
    </script>

</body>
</html>
